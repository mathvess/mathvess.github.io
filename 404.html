<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable | Mathias Vessiere</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e8eaf2;
        background: #0d1021;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 90% 65% at 50% 0%, rgba(92, 107, 192, 0.35), rgba(92, 107, 192, 0.10) 45%, transparent 75%),
          linear-gradient(180deg, #171b36 0%, #0d1021 60%, #090b19 100%);
        background-attachment: fixed;
        text-align: center;
      }
      .code {
        font-size: 5rem;
        font-weight: 700;
        letter-spacing: 4px;
        color: #8a94b8;
        line-height: 1;
      }
      .rule {
        width: 56px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #8a94b8, #c5cdf5);
        margin: 22px auto 0;
      }
      h1 { margin-top: 20px; font-size: 1.3rem; color: #f4f5fb; font-weight: 600; }
      p { margin-top: 12px; color: #aab1c9; line-height: 1.6; }
      .back {
        display: inline-block;
        margin-top: 30px;
        padding: 13px 30px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        color: #fff;
        background: #3a76f0;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }
      .back:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(154, 167, 232, 0.35);
        filter: brightness(1.15);
      }
      .back:active { transform: translateY(0); box-shadow: none; }
      footer { margin-top: 40px; font-size: 0.8rem; color: #5d6484; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <div class="rule" aria-hidden="true"></div>
      <h1>Page introuvable</h1>
      <p>La page que vous cherchez n'existe pas ou n'existe plus.<br />Le contact, lui, est toujours au même endroit.</p>
      <a class="back" href="/">Retour à l'accueil</a>
      <footer>© <span id="annee">2026</span> Mathias Vessiere</footer>
      <script>
        document.getElementById("annee").textContent = new Date().getFullYear();
      </script>
    </main>
  
</body>
</html>
